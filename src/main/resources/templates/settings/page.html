<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Settings','Starting values and defaults')}"></div><div class="row g-4"><div class="col-lg-6"><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Starting populations</h2><p class="small text-muted mb-0">Events are added on top of these starting values.</p></div><form th:action="@{/settings/populations}" method="post"><div class="vstack gap-3"><div class="row align-items-center" th:each="type : ${types}"><input type="hidden" name="ids" th:value="${type.id}"><div class="col"><label class="form-label mb-0" th:text="${type.name}"></label></div><div class="col-5"><input class="form-control" type="number" min="0" name="startingPopulations" th:value="${type.startingPopulation}"></div></div></div><button class="btn btn-gold mt-4" type="submit">Save populations</button></form></div></div><div class="col-lg-6"><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Default price per egg</h2><p class="small text-muted mb-0">New sales use these defaults; saved sale prices do not change.</p></div><form th:action="@{/settings/prices}" method="post"><div class="vstack gap-3"><div class="row align-items-center" th:each="price : ${prices}"><input type="hidden" name="ids" th:value="${price.id}"><div class="col"><label class="form-label mb-0" th:text="${price.channel}"></label></div><div class="col-5"><div class="input-group"><span class="input-group-text">sh</span><input class="form-control" type="number" min="0" step="0.01" name="values" th:value="${price.price}"></div></div></div></div><button class="btn btn-gold mt-4" type="submit">Save prices</button></form></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
