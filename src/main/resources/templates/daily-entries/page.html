<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daily Entries · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Daily Entries','Egg and feed history')}"></div><div class="daily-entries-page"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3"><div><p class="text-muted mb-1">Every saved daily log appears here in date order.</p><p class="small text-muted mb-0">Totals update automatically whenever a daily entry is saved.</p></div><a class="btn btn-gold" th:href="@{/daily-log}">+ Add daily entry</a></div><div class="paper-card daily-entries-card p-2 p-md-3"><div class="table-responsive"><table class="table daily-entries-table align-middle mb-0"><thead><tr><th>Date</th><th class="text-end">Kienyeji eggs</th><th class="text-end">Improved kienyeji</th><th class="text-end">Total eggs</th><th class="text-end">Feed amount (kg)</th><th class="text-end">Feed cost</th></tr></thead><tbody><tr th:each="log : ${logs}"><td><a class="text-decoration-none fw-semibold" th:href="@{/daily-log(date=${log.date})}" th:text="${log.date}"></a></td><td class="text-end numeric" th:text="${log.kienyejiEggs == null ? 0 : log.kienyejiEggs}">0</td><td class="text-end numeric" th:text="${log.improvedKienyejiEggs == null ? 0 : log.improvedKienyejiEggs}">0</td><td class="text-end numeric" th:text="${@dailyLogService.totalEggs(log)}">0</td><td class="text-end numeric" th:text="${#numbers.formatDecimal(@dailyLogService.totalFeedAmount(log),1,3)}">0.000</td><td class="text-end money" th:text="${'sh ' + #numbers.formatDecimal(@dailyLogService.totalFeedCost(log),1,2)}">sh 0.00</td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="6" class="empty-state">No daily entries yet. Add the first one from Daily Log.</td></tr></tbody><tfoot><tr><th class="total-label">Total</th><th class="text-end numeric" th:text="${totalKienyejiEggs}">0</th><th class="text-end numeric" th:text="${totalImprovedKienyejiEggs}">0</th><th class="text-end numeric" th:text="${totalEggs}">0</th><th class="text-end numeric" th:text="${#numbers.formatDecimal(totalFeedAmount,1,3)}">0.000</th><th class="text-end money" th:text="${'sh ' + #numbers.formatDecimal(totalFeedCost,1,2)}">sh 0.00</th></tr></tfoot></table></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
