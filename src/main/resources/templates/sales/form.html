<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sale · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Sale','Record eggs sold')}"></div><div class="paper-card p-3 p-md-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/sales}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Date</label><input class="form-control" type="date" th:field="*{date}" data-today></div><div class="col-md-4"><label class="form-label">Hen type</label><select class="form-select" th:field="*{henType}" required><option value="">Choose type</option><option th:each="type : ${henTypes}" th:value="${type.id}" th:text="${type.name}"></option></select></div><div class="col-md-4"><label class="form-label">Quantity eggs</label><input id="quantity" class="form-control" type="number" min="0" th:field="*{quantityEggs}" required></div><div class="col-md-4"><label class="form-label">Sold to</label><select id="soldTo" class="form-select" th:field="*{soldTo}"><option value="Shop" th:attr="data-default=${priceDefaults['Shop']}">Shop</option><option value="Buyer" th:attr="data-default=${priceDefaults['Buyer']}">Buyer</option><option value="Home" th:attr="data-default=${priceDefaults['Home']}">Home</option><option value="Other">Other</option></select></div><div class="col-md-4 other-buyer"><label class="form-label">Buyer name</label><input class="form-control" th:field="*{buyerName}" placeholder="Who was it sold to?"></div><div class="col-md-4"><label class="form-label">Price per egg (sh)</label><input id="price" class="form-control" type="number" min="0" step="0.01" th:field="*{pricePerEgg}" required><div class="small text-muted mt-1">Defaults from Settings; always editable.</div></div></div><div class="border-top mt-4 pt-3 d-flex justify-content-between"><div><div class="metric money">sh <span id="sale-total">0.00</span></div><div class="metric-label">Computed total</div></div><button class="btn btn-gold px-4" type="submit">Save sale</button></div></form></div><script>const sold=document.getElementById('soldTo'),price=document.getElementById('price'),qty=document.getElementById('quantity'),buyer=document.querySelector('.other-buyer');function sync(){let other=sold.value==='Other';buyer.style.display=other?'block':'none';if(!other&&sold.selectedOptions[0].dataset.default&&(!price.dataset.touched||!price.value))price.value=sold.selectedOptions[0].dataset.default;document.getElementById('sale-total').textContent=((parseFloat(qty.value||0)*parseFloat(price.value||0))).toFixed(2)}sold.addEventListener('change',()=>{price.dataset.touched='';sync()});price.addEventListener('input',()=>{price.dataset.touched='1';sync()});qty.addEventListener('input',sync);sync();</script><div th:replace="~{fragments/footer :: footer}"></div></body></html>
