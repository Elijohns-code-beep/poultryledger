<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Sales','Eggs sold')}"></div><div class="d-flex justify-content-between align-items-center mb-3"><p class="text-muted mb-0">Home is kept alongside every other sales channel.</p><a class="btn btn-gold" th:href="@{/sales/new}">+ New sale</a></div><div class="paper-card p-3 p-md-4"><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Hen type</th><th>Channel</th><th>Eggs</th><th>Price / egg</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="sale : ${sales}"><td th:text="${sale.date}"></td><td th:text="${sale.henType.name}"></td><td><span th:text="${sale.soldTo}"></span><span class="small text-muted" th:if="${sale.buyerName != null}" th:text="${' · ' + sale.buyerName}"></span></td><td th:text="${sale.quantityEggs}"></td><td class="money" th:text="${'sh ' + #numbers.formatDecimal(sale.pricePerEgg,1,2)}"></td><td class="money fw-semibold" th:text="${'sh ' + #numbers.formatDecimal(@saleService.totalAmount(sale),1,2)}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/sales/{id}/edit(id=${sale.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="7" class="empty-state">No sales yet.</td></tr></tbody></table></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
