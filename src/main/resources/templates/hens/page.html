<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hens · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Hens','Adult flock')}"></div><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div class="row g-4 mb-4"><div class="col-lg-8"><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Current flock</h2><p class="small text-muted mb-0">Starting population plus all events for each type.</p></div><div class="row g-3"><div class="col-sm-6" th:each="row : ${rows}"><div class="border rounded-3 p-3"><div class="metric" th:text="${row.current}">0</div><div class="metric-label" th:text="${row.type.name}">Type</div><div class="small text-muted mt-2" th:text="${'Starting: ' + row.type.startingPopulation}"></div></div></div></div></div></div><div class="col-lg-4"><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Add event</h2><p class="small text-muted mb-0">Negative changes cannot take the type below zero.</p></div><form th:action="@{/hens/events}" th:object="${eventForm}" method="post"><div class="mb-2"><label class="form-label">Date</label><input class="form-control" type="date" th:field="*{date}" data-today></div><div class="mb-2"><label class="form-label">Hen type</label><select class="form-select" th:field="*{henType}" required><option value="">Choose type</option><option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"></option></select></div><div class="mb-2"><label class="form-label">Change</label><input class="form-control" type="number" th:field="*{change}" placeholder="+ bought / - sold"></div><div class="mb-3"><label class="form-label">Reason</label><select class="form-select" th:field="*{reason}"><option value="Bought">Bought</option><option value="Sold">Sold</option><option value="Died">Died</option><option value="Culled">Culled</option><option value="Graduated from chicks">Graduated from chicks</option><option value="Other">Other</option></select></div><button class="btn btn-gold w-100" type="submit">Save event</button></form></div></div></div><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Population events</h2><p class="small text-muted mb-0">Running total is shown for each hen type.</p></div><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Change</th><th>Reason</th><th>Running total</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${event.date}"></td><td th:text="${event.henType.name}"></td><td th:text="${event.change > 0 ? '+' + event.change : event.change}"></td><td th:text="${event.reason}"></td><td class="fw-semibold" th:text="${@populationService.runningTotalAfter(event)}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="5" class="empty-state">No population events yet.</td></tr></tbody></table></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
