<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feed Mixtures · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Feed Mixtures','Recipes and costs')}"></div><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="text-muted mb-0">Ingredient prices are summed into a live mixture cost.</p></div><a class="btn btn-gold" th:href="@{/feed-mixtures/new}">+ New mixture</a></div><div class="paper-card p-3 p-md-4"><div class="table-responsive"><table class="table"><thead><tr><th>Code</th><th>Date</th><th>Total kg</th><th>Total price</th><th>Cost / kg</th><th></th></tr></thead><tbody><tr th:each="mixture : ${mixtures}"><td class="fw-semibold" th:text="${mixture.codeName}"></td><td th:text="${mixture.date}"></td><td th:text="${#numbers.formatDecimal(@feedMixtureService.totalQuantity(mixture),1,3)}"></td><td class="money" th:text="${'sh ' + #numbers.formatDecimal(@feedMixtureService.totalPrice(mixture),1,2)}"></td><td class="money fw-semibold" th:text="${'sh ' + #numbers.formatDecimal(@feedMixtureService.costPerKg(mixture),1,2)}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/feed-mixtures/{id}/edit(id=${mixture.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(mixtures)}"><td colspan="6" class="empty-state">No mixtures yet. Add the first recipe to use it in a Daily Log.</td></tr></tbody></table></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
