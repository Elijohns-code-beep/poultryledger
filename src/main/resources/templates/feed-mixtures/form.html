<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feed Mixture · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Feed Mixture','Build a recipe')}"></div><div class="paper-card p-3 p-md-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/feed-mixtures}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3 mb-4"><div class="col-sm-4"><label class="form-label">Date</label><input class="form-control" type="date" th:field="*{date}" data-today><div class="field-error" th:errors="*{date}"></div></div><div class="col-sm-5"><label class="form-label">Code name</label><input class="form-control" th:field="*{codeName}" placeholder="e.g. layers1"><div class="field-error" th:errors="*{codeName}"></div></div></div><div class="d-flex justify-content-between align-items-center mb-2"><div><h2 class="h5 mb-1">Ingredients</h2><p class="small text-muted mb-0">Price is the amount paid for that ingredient row.</p></div><button type="button" class="btn btn-sm btn-outline-secondary" id="add-ingredient">+ Add ingredient</button></div><div id="ingredient-rows"><div class="ingredient-row row g-2 align-items-end border rounded-3 p-3 mb-2" th:each="ingredient,stat : *{ingredients}"><input type="hidden" th:field="*{ingredients[__${stat.index}__].id}"><div class="col-md-3"><label class="form-label">Name</label><input class="form-control ing-name" th:field="*{ingredients[__${stat.index}__].name}" placeholder="Maize"></div><div class="col-md-3"><label class="form-label">Sourced from</label><input class="form-control" th:field="*{ingredients[__${stat.index}__].sourcedFrom}" placeholder="Supplier / store"></div><div class="col-md-2"><label class="form-label">Quantity kg</label><input class="form-control ing-qty" type="number" min="0" step="0.001" th:field="*{ingredients[__${stat.index}__].quantityKg}"></div><div class="col-md-2"><label class="form-label">Price (sh)</label><input class="form-control ing-price" type="number" min="0" step="0.01" th:field="*{ingredients[__${stat.index}__].price}"></div><div class="col-md-2 text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-ing">Remove</button></div></div></div><div class="row g-3 border-top pt-3 mt-3"><div class="col-sm-4"><div class="metric" id="total-qty" th:text="${#numbers.formatDecimal(@feedMixtureService.totalQuantity(form),1,3)}">0.000</div><div class="metric-label">Total quantity kg</div></div><div class="col-sm-4"><div class="metric money">sh <span id="total-price" th:text="${#numbers.formatDecimal(@feedMixtureService.totalPrice(form),1,2)}">0.00</span></div><div class="metric-label">Total price</div></div><div class="col-sm-4"><div class="metric money">sh <span id="cost-kg" th:text="${#numbers.formatDecimal(@feedMixtureService.costPerKg(form),1,2)}">0.00</span></div><div class="metric-label">Cost per kg</div></div></div><div class="sticky-actions d-flex justify-content-between mt-4"><a class="btn btn-outline-secondary" th:href="@{/feed-mixtures}">Cancel</a><button class="btn btn-gold px-4" type="submit">Save mixture</button></div></form></div><script>function recalc(){let q=0,p=0;document.querySelectorAll('.ingredient-row').forEach(r=>{q+=parseFloat(r.querySelector('.ing-qty').value||0);p+=parseFloat(r.querySelector('.ing-price').value||0)});document.getElementById('total-qty').textContent=q.toFixed(3);document.getElementById('total-price').textContent=p.toFixed(2);document.getElementById('cost-kg').textContent=(q?p/q:0).toFixed(2)}document.querySelectorAll('.ingredient-row input').forEach(i=>i.addEventListener('input',recalc));document.querySelectorAll('.remove-ing').forEach(b=>b.addEventListener('click',()=>{b.closest('.ingredient-row').remove();recalc()}));document.getElementById('add-ingredient').addEventListener('click',()=>{let wrap=document.getElementById('ingredient-rows'),i=wrap.querySelectorAll('.ingredient-row').length,r=document.createElement('div');r.className='ingredient-row row g-2 align-items-end border rounded-3 p-3 mb-2';r.innerHTML=`<div class="col-md-3"><label class="form-label">Name</label><input class="form-control ing-name" name="ingredients[${i}].name"></div><div class="col-md-3"><label class="form-label">Sourced from</label><input class="form-control" name="ingredients[${i}].sourcedFrom"></div><div class="col-md-2"><label class="form-label">Quantity kg</label><input class="form-control ing-qty" name="ingredients[${i}].quantityKg" type="number" min="0" step="0.001"></div><div class="col-md-2"><label class="form-label">Price (sh)</label><input class="form-control ing-price" name="ingredients[${i}].price" type="number" min="0" step="0.01"></div><div class="col-md-2 text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-ing">Remove</button></div>`;wrap.appendChild(r);r.querySelectorAll('input').forEach(x=>x.addEventListener('input',recalc));r.querySelector('.remove-ing').addEventListener('click',()=>{r.remove();recalc()});});recalc();</script><div th:replace="~{fragments/footer :: footer}"></div></body></html>
