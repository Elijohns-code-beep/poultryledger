<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sittings · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Sittings','Hatching record')}"></div><div class="d-flex justify-content-between align-items-center mb-3"><p class="text-muted mb-0">Expected hatch is calculated as 21 days from eggs given.</p><a class="btn btn-gold" th:href="@{/sittings/new}">+ New sitting</a></div><div class="paper-card p-3 p-md-4"><div class="table-responsive"><table class="table"><thead><tr><th>Date given</th><th>Eggs</th><th>Expected hatch</th><th>Hatched</th><th>Group code</th><th></th></tr></thead><tbody><tr th:each="s : ${sittings}"><td th:text="${s.dateGiven}"></td><td th:text="${s.eggsGiven}"></td><td th:text="${s.expectedHatchDate}"></td><td th:text="${s.chicksHatched == null ? '—' : s.chicksHatched}"></td><td><span class="badge text-bg-light" th:text="${s.chickGroupCode}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/sittings/{id}/edit(id=${s.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(sittings)}"><td colspan="6" class="empty-state">No sittings yet.</td></tr></tbody></table></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
