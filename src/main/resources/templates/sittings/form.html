<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sitting · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Sitting','Start a hatch record')}"></div><div class="paper-card p-3 p-md-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/sittings}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Date given</label><input id="dateGiven" class="form-control" type="date" th:field="*{dateGiven}" data-today><div class="field-error" th:errors="*{dateGiven}"></div></div><div class="col-md-4"><label class="form-label">Eggs given</label><input class="form-control" type="number" min="0" th:field="*{eggsGiven}"><div class="field-error" th:errors="*{eggsGiven}"></div></div><div class="col-md-4"><label class="form-label">Expected hatch date</label><input id="expected" class="form-control readonly-field" type="date" th:field="*{expectedHatchDate}" readonly><div class="small text-muted mt-1">Calculated automatically: date given + 21 days.</div></div><div class="col-md-4"><label class="form-label">Chicks hatched <span class="text-muted">(optional)</span></label><input class="form-control" type="number" min="0" th:field="*{chicksHatched}"></div><div class="col-md-4"><label class="form-label">Actual hatch date <span class="text-muted">(when hatched)</span></label><input class="form-control" type="date" th:field="*{actualHatchDate}"></div><div class="col-md-4"><label class="form-label">Chick group code</label><input class="form-control readonly-field" th:field="*{chickGroupCode}" readonly><div class="small text-muted mt-1">Generated from expected or actual hatch date; collisions get -2, -3.</div></div></div><div class="sticky-actions d-flex justify-content-between mt-4"><a class="btn btn-outline-secondary" th:href="@{/sittings}">Cancel</a><button class="btn btn-gold px-4" type="submit">Save sitting</button></div></form></div><script>document.getElementById('dateGiven').addEventListener('change',function(){let d=new Date(this.value+'T00:00:00');d.setDate(d.getDate()+21);document.getElementById('expected').value=d.toISOString().slice(0,10)});</script><div th:replace="~{fragments/footer :: footer}"></div></body></html>
