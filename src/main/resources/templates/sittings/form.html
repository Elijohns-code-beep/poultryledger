<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sitting · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Sitting','Start a hatch record')}"></div><div class="paper-card p-3 p-md-4"><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><form th:action="@{/sittings}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="dateGiven">Date given</label><input id="dateGiven" class="form-control" type="date" name="dateGiven" th:value="${form.dateGiven == null ? '' : #temporals.format(form.dateGiven, 'yyyy-MM-dd')}" data-today><div class="field-error" th:errors="*{dateGiven}"></div></div><div class="col-md-4"><label class="form-label" for="eggsGiven">Eggs given</label><input id="eggsGiven" class="form-control" type="number" min="0" th:field="*{eggsGiven}"><div class="field-error" th:errors="*{eggsGiven}"></div></div><div class="col-md-4"><label class="form-label" for="expected">Expected hatch date</label><input id="expected" class="form-control readonly-field" type="date" name="expectedHatchDate" th:value="${form.expectedHatchDate == null ? '' : #temporals.format(form.expectedHatchDate, 'yyyy-MM-dd')}" readonly><div class="small text-muted mt-1">Calculated automatically: date given + 21 days.</div></div><div class="col-md-4"><label class="form-label" for="chicksHatched">Chicks hatched <span class="text-muted">(optional)</span></label><input id="chicksHatched" class="form-control" type="number" min="0" th:field="*{chicksHatched}"></div><div class="col-md-4"><label class="form-label" for="chickGroupCode">Chick group code</label><input id="chickGroupCode" class="form-control readonly-field" th:field="*{chickGroupCode}" readonly><div class="small text-muted mt-1">Generated from the expected hatch date; collisions get -2, -3.</div></div></div><div class="sticky-actions d-flex justify-content-between mt-4"><a class="btn btn-outline-secondary" th:href="@{/sittings}">Cancel</a><button class="btn btn-gold px-4" type="submit">Save sitting</button></div></form></div><script>const dateGiven=document.getElementById('dateGiven');const expected=document.getElementById('expected');function localDateString(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}function updateExpected(){if(!dateGiven.value)return;const parts=dateGiven.value.split('-').map(Number);const date=new Date(parts[0],parts[1]-1,parts[2]);date.setDate(date.getDate()+21);expected.value=localDateString(date)}dateGiven.addEventListener('change',updateExpected);if(!expected.value)updateExpected();</script><div th:replace="~{fragments/footer :: footer}"></div></body></html>
