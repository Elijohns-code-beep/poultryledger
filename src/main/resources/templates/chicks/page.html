<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chicks · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header('Chicks','Young flock')}"></div><div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div><div class="row g-4"><div class="col-xl-4"><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Add a group</h2><p class="small text-muted mb-0">Use this for existing chicks or a sitting-created group.</p></div><form th:action="@{/chicks/groups}" th:object="${groupForm}" method="post"><div class="mb-3"><label class="form-label">Group code</label><input class="form-control" th:field="*{codeName}" placeholder="e.g. 1AUG26"><div class="field-error" th:errors="*{codeName}"></div></div><div class="mb-3"><label class="form-label">Starting count</label><input class="form-control" type="number" min="0" th:field="*{startingCount}"><div class="field-error" th:errors="*{startingCount}"></div></div><button class="btn btn-gold w-100" type="submit">Save group</button></form></div></div><div class="col-xl-8"><div class="paper-card p-3 p-md-4"><div class="d-flex justify-content-between align-items-center section-rule mb-3"><div><h2 class="h5 mb-1">Groups</h2><p class="small text-muted mb-0">Alive now = starting count + events.</p></div><div class="metric" th:text="${openCount}">0</div></div><div class="vstack gap-3"><div class="border rounded-3 p-3" th:each="group : ${groups}"><div class="d-flex flex-wrap justify-content-between gap-2"><div><span class="fw-bold" th:text="${group.codeName}"></span><span class="badge ms-2" th:classappend="${group.status.name() == 'OPEN' ? 'badge-open' : 'badge-closed'}" th:text="${group.status}"></span><div class="small text-muted mt-1" th:if="${group.sitting != null}" th:text="${'Linked to sitting · ' + group.sitting.dateGiven}"></div></div><div class="text-end"><div class="metric" th:text="${@chickService.chicksAliveNow(group)}">0</div><div class="metric-label">alive now</div></div></div><div class="d-flex flex-wrap gap-2 mt-3" th:if="${group.status.name() == 'OPEN'}"><form th:action="@{/chicks/{id}/events(id=${group.id})}" method="post" class="d-flex flex-wrap gap-2 flex-grow-1"><input class="form-control" style="max-width:145px" type="date" name="date" th:value="${today}"><input class="form-control" style="max-width:115px" type="number" name="change" placeholder="+ / -" required><input class="form-control flex-grow-1" type="text" name="reason" placeholder="Reason"><button class="btn btn-outline-secondary" type="submit">Add event</button></form><form th:action="@{/chicks/{id}/graduate(id=${group.id})}" method="post" class="d-flex flex-wrap gap-2" data-confirm="Move this group into the adult flock?"><select class="form-select" name="henTypeId" required><option value="">Move to…</option><option th:each="type : ${henTypes}" th:value="${type.id}" th:text="${type.name}"></option></select><input class="form-control" type="date" name="date" th:value="${today}"><button class="btn btn-primary" type="submit">Move to adult flock</button></form></div><div class="small text-muted mt-2" th:if="${group.status.name() == 'CLOSED'}">This group is closed and cannot receive more events.</div></div><div th:if="${#lists.isEmpty(groups)}" class="empty-state">No chick groups yet.</div></div></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
