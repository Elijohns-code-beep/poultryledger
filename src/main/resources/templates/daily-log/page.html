<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Daily Log · Poultry Ledger</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments/header :: header('Daily Log','Today\'s record')}"></div>
<div class="row g-4">
  <div class="col-xl-7"><div class="paper-card p-3 p-md-4"><div class="section-rule d-flex justify-content-between align-items-start mb-3"><div><h2 class="h5 mb-1">Record eggs and feed</h2><p class="text-muted small mb-0">One log per date. Existing dates open here for editing.</p></div><span class="badge text-bg-light">Computed below</span></div>
    <div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div>
    <form th:action="@{/daily-log}" th:object="${form}" method="post">
      <input type="hidden" th:field="*{id}">
      <div class="row g-3 mb-4"><div class="col-sm-4"><label class="form-label">Date</label><input class="form-control" type="date" th:field="*{date}" data-today><div class="field-error" th:errors="*{date}"></div></div><div class="col-sm-4"><label class="form-label">Kienyeji eggs</label><input class="form-control" type="number" min="0" th:field="*{kienyejiEggs}"><div class="field-error" th:errors="*{kienyejiEggs}"></div></div><div class="col-sm-4"><label class="form-label">Improved Kienyeji eggs</label><input class="form-control" type="number" min="0" th:field="*{improvedKienyejiEggs}"><div class="field-error" th:errors="*{improvedKienyejiEggs}"></div></div></div>
      <div class="d-flex justify-content-between align-items-center mb-2"><h3 class="h6 mb-0">Feed usage</h3><button type="button" class="btn btn-sm btn-outline-secondary" id="add-feed">+ Add feed row</button></div>
      <div id="feed-rows"><div class="feed-row border rounded-3 p-3 mb-2" th:each="usage,stat : *{feedUsages}" th:attr="data-index=${stat.index}"><input type="hidden" th:field="*{feedUsages[__${stat.index}__].id}"><div class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label">Feed</label><select class="form-select feed-select" th:field="*{feedUsages[__${stat.index}__].feedCode}"><option value="">Choose feed</option><option th:each="mixture : ${mixtures}" th:value="${mixture.codeName}" th:text="${mixture.codeName}" th:attr="data-cost=${@feedMixtureService.costPerKg(mixture)}"></option><option value="Other">Other</option></select></div><div class="col-md-3 other-name-wrap"><label class="form-label">Other feed name</label><input class="form-control other-name" th:field="*{feedUsages[__${stat.index}__].otherFeedName}" placeholder="e.g. maize bran"></div><div class="col-md-2"><label class="form-label">Qty kg</label><input class="form-control usage-qty" type="number" min="0" step="0.001" th:field="*{feedUsages[__${stat.index}__].quantityKg}"></div><div class="col-md-2"><label class="form-label">Unit cost / kg</label><input class="form-control usage-cost" type="number" min="0" step="0.01" th:field="*{feedUsages[__${stat.index}__].unitCostAtTime}" th:readonly="${usage.feedCode != 'Other'}"></div><div class="col-md-1"><button type="button" class="btn btn-sm btn-outline-danger remove-feed" aria-label="Remove">×</button></div></div><div class="small text-muted mt-2">Cost: <span class="row-cost money">sh 0.00</span></div></div></div>
      <div class="sticky-actions d-flex justify-content-between align-items-center mt-3"><div class="small text-muted">Rows keep their saved unit cost.</div><button class="btn btn-gold px-4" type="submit">Save daily log</button></div>
    </form>
  </div></div>
  <div class="col-xl-5"><div class="paper-card p-3 p-md-4 mb-4"><div class="row g-3"><div class="col-6"><div class="metric" th:text="${totalEggs}">0</div><div class="metric-label">Eggs in this log</div></div><div class="col-6"><div class="metric money">sh <span th:text="${#numbers.formatDecimal(totalFeedCost,1,2)}">0.00</span></div><div class="metric-label">Feed cost</div></div></div></div><div class="paper-card p-3 p-md-4"><div class="section-rule mb-3"><h2 class="h5 mb-1">Recent logs</h2><p class="text-muted small mb-0">Newest first · Home sales are not separated elsewhere.</p></div><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Date</th><th>Eggs</th><th>Feed cost</th></tr></thead><tbody><tr th:each="log : ${logs}"><td><a class="text-decoration-none fw-semibold" th:href="@{/daily-log(date=${log.date})}" th:text="${log.date}"></a></td><td th:text="${log.kienyejiEggs + log.improvedKienyejiEggs}"></td><td class="money" th:text="${'sh ' + #numbers.formatDecimal(@dailyLogService.totalFeedCost(log),1,2)}"></td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="3" class="empty-state">No daily logs yet.</td></tr></tbody></table></div></div></div>
</div>
<script>const feedOptions=()=>`<option value="">Choose feed</option>`+Array.from(document.querySelectorAll('.feed-select option')).filter(o=>o.value).map(o=>`<option value="${o.value}" data-cost="${o.dataset.cost||''}">${o.textContent}</option>`).join('');function syncFeed(row){const s=row.querySelector('.feed-select'),c=row.querySelector('.usage-cost'),n=row.querySelector('.other-name-wrap');const other=s.value==='Other';n.style.display=other?'block':'none';c.readOnly=!other;if(!other&&s.selectedOptions[0])c.value=s.selectedOptions[0].dataset.cost||c.value;row.querySelector('.row-cost').textContent='sh '+((parseFloat(row.querySelector('.usage-qty').value||0)*parseFloat(c.value||0)).toFixed(2));}document.querySelectorAll('.feed-row').forEach(r=>{r.querySelector('.feed-select').addEventListener('change',()=>syncFeed(r));r.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>syncFeed(r)));syncFeed(r);});document.getElementById('add-feed').addEventListener('click',()=>{const wrap=document.getElementById('feed-rows'),i=wrap.querySelectorAll('.feed-row').length,row=document.createElement('div');row.className='feed-row border rounded-3 p-3 mb-2';row.innerHTML=`<div class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label">Feed</label><select class="form-select feed-select" name="feedUsages[${i}].feedCode">${feedOptions()}<option value="Other">Other</option></select></div><div class="col-md-3 other-name-wrap"><label class="form-label">Other feed name</label><input class="form-control other-name" name="feedUsages[${i}].otherFeedName"></div><div class="col-md-2"><label class="form-label">Qty kg</label><input class="form-control usage-qty" name="feedUsages[${i}].quantityKg" type="number" min="0" step="0.001"></div><div class="col-md-2"><label class="form-label">Unit cost / kg</label><input class="form-control usage-cost" name="feedUsages[${i}].unitCostAtTime" type="number" min="0" step="0.01"></div><div class="col-md-1"><button type="button" class="btn btn-sm btn-outline-danger remove-feed">×</button></div></div><div class="small text-muted mt-2">Cost: <span class="row-cost money">sh 0.00</span></div>`;wrap.appendChild(row);row.querySelector('.feed-select').addEventListener('change',()=>syncFeed(row));row.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>syncFeed(row)));row.querySelector('.remove-feed').addEventListener('click',()=>row.remove());syncFeed(row);});document.querySelectorAll('.remove-feed').forEach(b=>b.addEventListener('click',()=>b.closest('.feed-row').remove()));</script>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
