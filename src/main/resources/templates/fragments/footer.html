<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="footer">
  <footer class="text-center small text-muted py-4">Poultry Ledger · simple records for the daily rhythm of the farm</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('[data-today]').forEach(function(el){ if(!el.value) el.value=new Date().toISOString().slice(0,10); });
    document.querySelectorAll('[data-confirm]').forEach(function(el){ el.addEventListener('submit',function(e){ if(!confirm(el.dataset.confirm)){e.preventDefault();} }); });
  </script>
</div>
